<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberMechanic Journal</title>
  <link rel="stylesheet" href="style.css"><meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="topbar">
  <h2>CyberMechanic Journal</h2>
  <p>Personal Growth • Tech • Automotive Journey</p>
</header>
  <div id="login">
    <h2>Login</h2>
    <input id="user" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Enter</button>
  </div>

  <div id="app" style="display:none;">
    <h1>My Growth Journal</h1>

    <textarea id="title" placeholder="Title"></textarea>
    <textarea id="content" placeholder="Write your journey..."></textarea>
    <button onclick="addPost()">Publish</button>

    <div id="posts"></div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6-nAvXp0zAnUPL1HG5kQ2Vmnf4k95CSw",
      authDomain: "cybermechanicjourney.firebaseapp.com",
      projectId: "cybermechanicjourney",
      storageBucket: "cybermechanicjourney.firebasestorage.app",
      messagingSenderId: "127296364969",
      appId: "1:127296364969:web:fdc9453e016450285ae4b8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async function () {
      const email = document.getElementById("user").value;
      const password = document.getElementById("pass").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    };

    window.addPost = function () {
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;

      const post = document.createElement("div");
      post.innerHTML = `<h3>${title}</h3><p>${content}</p>`;
      document.getElementById("posts").prepend(post);
    };
  </script>

</body>
</html>
